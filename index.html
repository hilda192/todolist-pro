<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento PRO - Hilda</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-900 to-blue-900 min-h-screen text-white">
<div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white text-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
    <h1 class="text-3xl font-bold text-center mb-2 text-blue-600"><i class="fas fa-tools"></i> Mantenimiento PRO</h1>
    <p class="text-center text-gray-500 mb-6">By Hilda - ISIC</p>
    <input id="email" type="email" placeholder="Correo" class="w-full p-3 border rounded-lg mb-3">
    <input id="password" type="password" placeholder="Contraseña (6 letras)" class="w-full p-3 border rounded-lg mb-4">
    <button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold">Entrar / Registrarse</button>
    <p id="login-error" class="text-red-500 text-sm mt-3 text-center"></p>
  </div>
</div>

<div id="app-screen" class="hidden">
  <header class="bg-white/10 backdrop-blur p-4 flex justify-between items-center">
    <h1 class="font-bold text-xl"><i class="fas fa-list-check"></i> Mis Tareas</h1>
    <div><span id="user-email" class="text-sm mr-3"></span><button onclick="logout()" class="bg-red-500 px-4 py-2 rounded-lg text-sm">Salir</button></div>
  </header>
  <main class="p-4 max-w-2xl mx-auto">
    <div class="bg-white text-gray-800 p-5 rounded-2xl mb-6">
      <h2 class="font-bold mb-3">Nueva Tarea</h2>
      <input id="titulo" placeholder="Ej: Programar bomba" class="w-full p-3 border rounded-lg mb-2">
      <textarea id="descripcion" placeholder="Descripción" class="w-full p-3 border rounded-lg mb-2"></textarea>
      <div class="flex gap-2 mb-3">
        <select id="area" class="flex-1 p-3 border rounded-lg"><option>Preventivo</option><option>Correctivo</option><option>Eléctrico</option><option>Mecánico</option></select>
        <select id="prioridad" class="flex-1 p-3 border rounded-lg"><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select>
      </div>
      <button onclick="guardarTarea()" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold">Guardar en la Nube <i class="fas fa-cloud"></i></button>
      <p id="save-status" class="text-center text-sm mt-2"></p>
    </div>
    <div id="lista-tareas" class="space-y-3"></div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, where, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqP5V7p2p7p7p7p7p7p7p7",
  authDomain: "mantenimiento--pro.firebaseapp.com",
  projectId: "mantenimiento--pro",
  storageBucket: "mantenimiento--pro.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};

// Tu config real - pegala de Firebase > Configuracion del proyecto > General
const realConfig = {
  apiKey: "AIzaSyA3Z7hW2y7X8Ql9p0r1s2t3u4v5w6x7y8z9",
  authDomain: "mantenimiento--pro.firebaseapp.com",
  projectId: "mantenimiento--pro",
  storageBucket: "mantenimiento--pro.firebasestorage.app",
  messagingSenderId: "1081234567890",
  appId: "1:1081234567890:web:abcd1234efgh5678"
};

const app = initializeApp(realConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.login = async () => {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  const errEl = document.getElementById('login-error');
  try { await signInWithEmailAndPassword(auth, email, pass); } 
  catch (e) { 
    try { await createUserWithEmailAndPassword(auth, email, pass); }
    catch (e2) { errEl.textContent = e2.message; }
  }
}
window.logout = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    document.getElementById('user-email').textContent = user.email;
    cargarTareas(user);
  } else {
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app-screen').classList.add('hidden');
  }
});

function cargarTareas(user){
  const q = query(collection(db, "tareas"), where("uid", "==", user.uid));
  onSnapshot(q, (snap) => {
    let tareas = [];
    snap.forEach(d => tareas.push({id: d.id, ...d.data()}));
    tareas.sort((a,b) => (b.creado?.seconds||0) - (a.creado?.seconds||0));
    const lista = document.getElementById('lista-tareas');
    if(tareas.length==0){ lista.innerHTML = "<p class='text-center opacity-70'>No hay tareas aún</p>"; return; }
    lista.innerHTML = tareas.map(t => `
      <div class="bg-white text-gray-800 p-4 rounded-xl flex justify-between items-start">
        <div><h3 class="font-bold ${t.completada?'line-through':''}">${t.titulo}</h3><p class="text-sm text-gray-500">${t.descripcion||''}</p><span class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded">${t.area} - ${t.prioridad}</span></div>
        <div class="flex gap-2"><button onclick="toggle('${t.id}', ${!t.completada})" class="bg-green-100 p-2 rounded"><i class="fas fa-check"></i></button><button onclick="borrar('${t.id}')" class="bg-red-100 p-2 rounded"><i class="fas fa-trash"></i></button></div>
      </div>
    `).join('');
  }, (error) => { console.error(error); document.getElementById('lista-tareas').innerHTML = "Error: "+error.message; });
}

window.guardarTarea = async () => {
  const user = auth.currentUser;
  const titulo = document.getElementById('titulo').value;
  if(!titulo) return alert("Escribe un titulo");
  try {
    await addDoc(collection(db, "tareas"), {
      uid: user.uid,
      titulo: titulo,
      descripcion: document.getElementById('descripcion').value,
      area: document.getElementById('area').value,
      prioridad: document.getElementById('prioridad').value,
      completada: false,
      creado: serverTimestamp()
    });
    document.getElementById('titulo').value = ""; document.getElementById('descripcion').value = "";
    document.getElementById('save-status').textContent = "¡Guardado en la nube! ✅";
    setTimeout(()=>document.getElementById('save-status').textContent="", 2000);
  } catch(e){ alert("Error al guardar: "+e.message); }
}
window.borrar = async (id) => { if(confirm("¿Borrar?")) await deleteDoc(doc(db, "tareas", id)); }
window.toggle = async (id, val) => { await updateDoc(doc(db, "tareas", id), {completada: val}); }
</script>
</body>
</html>
