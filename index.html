<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToDo PRO - Hilda</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0f172a;color:white;min-height:100vh;padding:20px}
.container{max-width:600px;margin:0 auto;background:#1e293b;border-radius:20px;padding:25px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
h1{text-align:center;margin-bottom:5px;background:linear-gradient(90deg,#38bdf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:28px}
.sub{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:20px}
.input-box{display:flex;gap:10px;margin-bottom:15px}
#taskInput{flex:1;padding:14px;border-radius:12px;border:none;background:#0f172a;color:white;outline:none;font-size:15px}
button{padding:12px 18px;border:none;border-radius:12px;cursor:pointer;font-weight:bold;transition:.2s}
#addBtn{background:#38bdf8;color:#0f172a}
#micBtn{background:#334155;color:white;font-size:18px}
#micBtn.listening{background:#ef4444;animation:pulse 1s infinite}
#speakBtn{background:#1e293b;color:#a78bfa;border:1px solid #334155;width:100%;margin-bottom:15px}
.controls{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}
.filter{padding:8px 14px;background:#0f172a;color:#94a3b8;border-radius:20px;font-size:13px}
.filter.active{background:#38bdf8;color:#0f172a}
#search{width:100%;padding:10px 14px;border-radius:10px;border:none;background:#0f172a;color:white;margin-bottom:15px;outline:none}
.stats{display:flex;justify-content:space-between;color:#94a3b8;font-size:13px;margin-bottom:15px;background:#0f172a;padding:10px;border-radius:10px}
ul{list-style:none}
li{background:#0f172a;padding:14px;border-radius:12px;display:flex;align-items:center;gap:10px;margin-bottom:10px;animation:slide.3s}
li.done{opacity:.5;text-decoration:line-through}
li input[type=checkbox]{width:18px;height:18px}
.task-text{flex:1}
.del{background:transparent;color:#ef4444;font-size:18px;padding:5px}
#status{text-align:center;color:#38bdf8;font-size:12px;height:15px;margin-bottom:10px}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes slide{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div class="container">
<h1>ToDo PRO + Voz 🎤</h1>
<p class="sub">By Hilda - Más pro que el de Miguel</p>

<div id="status"></div>

<div class="input-box">
<input type="text" id="taskInput" placeholder="Escribe o usa el micrófono...">
<button id="micBtn">🎤</button>
<button id="addBtn">+</button>
</div>

<button id="speakBtn">🔊 Escuchar mis tareas pendientes</button>
<input type="text" id="search" placeholder="🔍 Buscar tarea...">

<div class="controls">
<button class="filter active" data-f="all">Todas</button>
<button class="filter" data-f="todo">Pendientes</button>
<button class="filter" data-f="done">Completadas</button>
</div>

<div class="stats">
<span id="total">Total: 0</span>
<span id="pending">Pendientes: 0</span>
<span id="completed">Hechas: 0</span>
</div>

<ul id="list"></ul>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem('hilda-pro-voz') || '[]');
let filter = 'all';
const input = document.getElementById('taskInput');
const list = document.getElementById('list');
const status = document.getElementById('status');

function save(){ localStorage.setItem('hilda-pro-voz', JSON.stringify(tasks)); }
function render(){
    list.innerHTML='';
    let f = document.getElementById('search').value.toLowerCase();
    let filtered = tasks.filter(t=>{
        if(filter==='todo' && t.done) return false;
        if(filter==='done' &&!t.done) return false;
        if(f &&!t.text.toLowerCase().includes(f)) return false;
        return true;
    });
    filtered.forEach((t,i)=>{
        let li=document.createElement('li');
        if(t.done) li.classList.add('done');
        li.innerHTML=`<input type="checkbox" ${t.done?'checked':''} onchange="toggle(${tasks.indexOf(t)})"><span class="task-text">${t.text}</span><button class="del" onclick="del(${tasks.indexOf(t)})">✕</button>`;
        list.appendChild(li);
    });
    document.getElementById('total').textContent='Total: '+tasks.length;
    document.getElementById('pending').textContent='Pendientes: '+tasks.filter(t=>!t.done).length;
    document.getElementById('completed').textContent='Hechas: '+tasks.filter(t=>t.done).length;
}
function addTask(){
    if(!input.value.trim()) return;
    tasks.unshift({text:input.value.trim(),done:false});
    input.value=''; save(); render();
    speak('Tarea agregada');
}
function toggle(i){ tasks[i].done=!tasks[i].done; save(); render(); }
function del(i){ tasks.splice(i,1); save(); render(); }
document.getElementById('addBtn').onclick=addTask;
input.addEventListener('keypress',e=>{ if(e.key==='Enter') addTask(); });
document.getElementById('search').oninput=render;
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); filter=b.dataset.f; render();
});

// VOZ A TEXTO
const micBtn = document.getElementById('micBtn');
let recog;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recog = new SR(); recog.lang='es-MX'; recog.continuous=false;
    recog.onstart=()=>{ micBtn.classList.add('listening'); status.textContent='🎤 Escuchando... habla ahora'; };
    recog.onend=()=>{ micBtn.classList.remove('listening'); status.textContent=''; };
    recog.onresult=(e)=>{
        input.value = e.results[0][0].transcript;
        addTask();
    };
    micBtn.onclick=()=>{ recog.start(); };
} else {
    micBtn.style.display='none'; status.textContent='Tu navegador no soporta voz, usa Chrome';
}

// TEXTO A VOZ
function speak(txt){
    if('speechSynthesis' in window){
        let u = new SpeechSynthesisUtterance(txt);
        u.lang='es-MX'; speechSynthesis.speak(u);
    }
}
document.getElementById('speakBtn').onclick=()=>{
    let pend = tasks.filter(t=>!t.done);
    if(pend.length===0) speak('No tienes tareas pendientes');
    else speak('Tienes '+pend.length+' tareas pendientes: '+pend.map(t=>t.text).join(', '));
};
render();
</script>
</body>
</html>
