<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento PRO IA - Hilda</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen">
<div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white text-gray-800 p-8 rounded-2xl w-full max-w-md text-center">
    <h1 class="text-3xl font-bold text-blue-600">Mantenimiento PRO IA</h1><p class="text-gray-500 mb-4">By Hilda - IA compara fotos</p>
    <input id="email" class="w-full p-3 border rounded-xl mb-3" value="lias21530@isic.edu.mx"><input id="password" type="password" placeholder="Contraseña" class="w-full p-3 border rounded-xl mb-3"><button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Entrar</button><p id="login-error" class="text-red-500 text-sm mt-2"></p>
  </div>
</div>
<div id="app-screen" class="hidden">
  <header class="p-4 flex justify-between bg-white/10"><b>🚀 PRO IA V10</b><span id="user-email" class="text-xs opacity-70"></span><button onclick="logout()" class="bg-red-500 px-3 rounded-lg text-sm">Salir</button></header>
  <main class="p-4 max-w-4xl mx-auto">
    <div class="grid grid-cols-3 gap-2 mb-4"><div class="bg-white/10 p-3 rounded-xl text-center"><b id="stat-total">0</b><p class="text-xs">Total</p></div><div class="bg-green-500/20 p-3 rounded-xl text-center"><b id="stat-hechas">0</b><p class="text-xs">Hechas</p></div><div class="bg-blue-500/20 p-3 rounded-xl text-center"><button onclick="analisisIA()" class="text-xs bg-blue-600 px-3 py-1 rounded-full">🤖 IA Verifica</button></div></div>
    <div id="ia-box" class="hidden bg-gradient-to-r from-purple-600 to-blue-600 p-4 rounded-2xl mb-4"><h3 class="font-bold">🤖 Análisis IA Visual:</h3><p id="ia-text" class="text-sm mt-2"></p></div>
    <div class="bg-white text-gray-800 p-5 rounded-2xl mb-6">
      <h2 class="font-bold mb-3">Nueva Tarea</h2>
      <div class="flex gap-2 mb-2"><input id="titulo" placeholder="Título..." class="flex-1 p-3 border rounded-xl"><button onclick="startVoz('titulo')" class="bg-red-500 text-white px-3 rounded-xl"><i class="fas fa-microphone"></i></button></div>
      <div class="flex gap-2 mb-2"><textarea id="descripcion" placeholder="Descripción..." class="flex-1 p-3 border rounded-xl"></textarea><button onclick="startVoz('descripcion')" class="bg-red-500 text-white px-3 rounded-xl h-fit"><i class="fas fa-microphone"></i></button></div>
      <div class="flex gap-2 mb-3"><select id="area" class="flex-1 p-3 border rounded-xl"><option>Preventivo</option><option>Correctivo</option><option>Eléctrico</option><option>Mecánico</option><option>Programación</option></select><select id="prioridad" class="flex-1 p-3 border rounded-xl"><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select></div>
      <div class="border-2 border-dashed border-red-300 rounded-xl p-3 mb-2 text-center bg-red-50">
        <input type="file" id="foto-antes" accept="image/*" capture="environment" class="hidden" onchange="previewFoto(event,'antes')">
        <button onclick="document.getElementById('foto-antes').click()" class="text-sm text-red-600 font-bold"><i class="fas fa-camera"></i> 1. FOTO ANTES (Falla)</button>
        <img id="preview-antes" class="hidden w-full h-32 object-cover rounded-xl mt-2">
      </div>
      <div class="border-2 border-dashed border-green-300 rounded-xl p-3 mb-3 text-center bg-green-50">
        <input type="file" id="foto-despues" accept="image/*" capture="environment" class="hidden" onchange="previewFoto(event,'despues')">
        <button onclick="document.getElementById('foto-despues').click()" class="text-sm text-green-600 font-bold"><i class="fas fa-camera"></i> 2. FOTO DESPUÉS (Reparado)</button>
        <img id="preview-despues" class="hidden w-full h-32 object-cover rounded-xl mt-2">
      </div>
      <button onclick="guardarTarea()" class="w-full bg-black text-white p-3 rounded-xl font-bold">Guardar Evidencia</button><p id="save-status" class="text-center text-sm mt-2 font-bold text-green-600"></p>
    </div>
    <input id="buscador" oninput="filtrar()" placeholder="🔍 Buscar..." class="w-full p-3 rounded-xl bg-white/10 border border-white/20 mb-4">
    <div id="lista-tareas" class="grid md:grid-cols-2 gap-4"></div>
  </main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, where, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAYr6gWLwirpYIvHDccIhWLifz3bk7WHl8", authDomain: "mantenimiento--pro.firebaseapp.com", projectId: "mantenimiento--pro", storageBucket: "mantenimiento--pro.firebasestorage.app", messagingSenderId: "954410177409", appId: "1:954410177409:web:83bba9aaf3d94c24c50e80" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
let todas=[], fotoAntes="", fotoDespues="";
window.login=async()=>{const e=document.getElementById('email').value,p=document.getElementById('password').value,err=document.getElementById('login-error'); err.textContent="Cargando..."; try{await signInWithEmailAndPassword(auth,e,p); err.textContent="";}catch{try{await createUserWithEmailAndPassword(auth,e,p); err.textContent="";}catch(e2){err.textContent=e2.message;}}}
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,(u)=>{if(u){document.getElementById('login-screen').classList.add('hidden');document.getElementById('app-screen').classList.remove('hidden');document.getElementById('user-email').textContent=u.email;cargar(u);}else{document.getElementById('login-screen').classList.remove('hidden');document.getElementById('app-screen').classList.add('hidden');}});
function cargar(user){onSnapshot(query(collection(db,"tareas"),where("uid","==",user.uid)),(snap)=>{todas=[]; snap.forEach(d=>todas.push({id:d.id,...d.data()})); todas.sort((a,b)=>(b.creado?.seconds||0)-(a.creado?.seconds||0)); document.getElementById('stat-total').textContent=todas.length; document.getElementById('stat-hechas').textContent=todas.filter(t=>t.completada).length; filtrar();});}
function comprimir(file, cb){const img=new Image(); img.onload=()=>{const c=document.createElement('canvas'); const MAX=300; let w=img.width,h=img.height; if(w>h){if(w>MAX){h*=MAX/w; w=MAX;}}else{if(h>MAX){w*=MAX/h; h=MAX;}} c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',0.3));}; img.src=URL.createObjectURL(file);}
window.previewFoto=(e,tipo)=>{const file=e.target.files[0]; if(!file)return; comprimir(file,(b64)=>{if(tipo=='antes'){fotoAntes=b64; document.getElementById('preview-antes').src=b64; document.getElementById('preview-antes').classList.remove('hidden');}else{fotoDespues=b64; document.getElementById('preview-despues').src=b64; document.getElementById('preview-despues').classList.remove('hidden');}});}
window.startVoz=(campo)=>{if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window))return alert("Usa Chrome"); const Rec=window.SpeechRecognition||window.webkitSpeechRecognition; const rec=new Rec(); rec.lang='es-MX'; rec.start(); rec.onresult=(ev)=>{document.getElementById(campo).value+= (document.getElementById(campo).value?" ":"") + ev.results[0][0].transcript;}; rec.onerror=()=>{};}
window.guardarTarea=async()=>{const user=auth.currentUser, tit=document.getElementById('titulo').value; if(!tit)return alert("Título"); document.getElementById('save-status').textContent="Guardando... ⏳"; try{await addDoc(collection(db,"tareas"),{uid:user.uid,titulo:tit,descripcion:document.getElementById('descripcion').value,area:document.getElementById('area').value,prioridad:document.getElementById('prioridad').value,completada:false,fotoAntes:fotoAntes,fotoDespues:fotoDespues,creado:serverTimestamp()}); document.getElementById('titulo').value=""; document.getElementById('descripcion').value=""; document.getElementById('preview-antes').classList.add('hidden'); document.getElementById('preview-despues').classList.add('hidden'); fotoAntes=""; fotoDespues=""; document.getElementById('save-status').textContent="¡Guardado! ✅"; setTimeout(()=>document.getElementById('save-status').textContent="",2000);}catch(e){alert("Error: "+e.message);}}
window.filtrar=()=>{const txt=document.getElementById('buscador').value.toLowerCase(); let f=todas.filter(t=>t.titulo.toLowerCase().includes(txt)); document.getElementById('lista-tareas').innerHTML=f.map(t=>{let veredicto=""; if(t.fotoAntes && t.fotoDespues) veredicto=`<p class='text-xs bg-green-100 text-green-700 p-2 rounded-lg mt-2'>✅ IA: Tarea verificada con evidencia fotográfica (ANTES y DESPUÉS)</p>`; else if(t.fotoAntes &&!t.fotoDespues) veredicto=`<p class='text-xs bg-yellow-100 text-yellow-700 p-2 rounded-lg mt-2'>⚠️ IA: Falta foto del DESPUÉS para verificar reparación</p>`; else if(!t.fotoAntes) veredicto=`<p class='text-xs bg-gray-100 p-2 rounded-lg mt-2'>IA: Sin evidencia fotográfica</p>`; return `<div class="bg-white text-gray-800 p-4 rounded-2xl shadow"><div class="flex justify-between text-xs mb-2"><span class="font-bold ${t.prioridad=='alta'?'text-red-500':'text-green-600'}">${t.prioridad.toUpperCase()}</span><span class="bg-gray-100 px-2 rounded-full">${t.area}</span></div><h3 class="font-bold ${t.completada?'line-through':''}">${t.titulo}</h3><p class="text-sm text-gray-500">${t.descripcion||''}</p><div class="grid grid-cols-2 gap-2 mt-2">${t.fotoAntes?`<div><p class='text-[10px]'>ANTES:</p><img src="${t.fotoAntes}" class="w-full h-20 object-cover rounded">`:""}${t.fotoAntes?`</div>`:""}${t.fotoDespues?`<div><p class='text-[10px]'>DESPUÉS:</p><img src="${t.fotoDespues}" class="w-full h-20 object-cover rounded"></div>`:""}</div>${veredicto}<div class="flex gap-2 mt-3"><button onclick="toggle('${t.id}',${!t.completada})" class="flex-1 ${t.completada?'bg-gray-200':'bg-green-600 text-white'} p-2 rounded-xl text-sm">${t.completada?'Deshacer':'Hecha'}</button><button onclick="borrar('${t.id}')" class="bg-red-50 text-red-500 p-2 rounded-xl"><i class="fas fa-trash"></i></button><button onclick="leerVoz('${t.titulo.replace(/'/g,'')}')" class="bg-blue-50 text-blue-500 p-2 rounded-xl"><i class="fas fa-volume-up"></i></button></div></div>`;}).join('');}
window.borrar=async(id)=>{if(confirm("¿Borrar?"))await deleteDoc(doc(db,"tareas",id));}
window.toggle=async(id,v)=>{await updateDoc(doc(db,"tareas",id),{completada:v});}
window.leerVoz=(txt)=>{const u=new SpeechSynthesisUtterance(txt); u.lang='es-MX'; speechSynthesis.speak(u);}
window.analisisIA=()=>{if(todas.length==0)return alert("No hay tareas"); const conEvidencia=todas.filter(t=>t.fotoAntes&&t.fotoDespues).length; const sinDespues=todas.filter(t=>t.fotoAntes&&!t.fotoDespues&&!t.completada).length; const sinFoto=todas.filter(t=>!t.fotoAntes).length; document.getElementById('ia-box').classList.remove('hidden'); document.getElementById('ia-text').innerHTML=`🔍 <b>IA Visual analizó ${todas.length} tareas:</b><br>• ${conEvidencia} con evidencia completa (ANTES/DESPUÉS) - <b>VERIFICADAS</b><br>• ${sinDespues} con falla sin reparar (solo foto ANTES)<br>• ${sinFoto} sin foto<br><br><b>Veredicto IA:</b> ${sinDespues>0?`⚠️ Tienes ${sinDespues} tareas que requieren foto del DESPUÉS para comprobar que se reparó.`:`✅ ${conEvidencia>0?'Todas las tareas tienen evidencia fotográfica completa. Excelente control de calidad.':'Toma foto ANTES y DESPUÉS para verificación automática.'}`}<br><br><b>Productividad:</b> ${Math.round(todas.filter(t=>t.completada).length/todas.length*100)}%`; window.leerVoz("Análisis completado. "+conEvidencia+" tareas verificadas con foto");}
</script>
</body>
</html>
