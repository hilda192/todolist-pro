<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento PRO IA - Hilda</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen">
<div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white text-gray-800 p-8 rounded-2xl w-full max-w-md text-center">
    <h1 class="text-3xl font-bold text-blue-600">Mantenimiento PRO IA</h1><p class="text-gray-500 mb-4">By Hilda - con Foto + Voz + IA</p>
    <input id="email" class="w-full p-3 border rounded-xl mb-3" value="lias21530@isic.edu.mx"><input id="password" type="password" placeholder="Contraseña" class="w-full p-3 border rounded-xl mb-3"><button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Entrar</button><p id="login-error" class="text-red-500 text-sm mt-2"></p>
  </div>
</div>
<div id="app-screen" class="hidden">
  <header class="p-4 flex justify-between bg-white/10"><b>🚀 PRO IA</b><span id="user-email" class="text-xs opacity-70"></span><button onclick="logout()" class="bg-red-500 px-3 rounded-lg text-sm">Salir</button></header>
  <main class="p-4 max-w-4xl mx-auto">
    <div class="grid grid-cols-3 gap-2 mb-4"><div class="bg-white/10 p-3 rounded-xl text-center"><b id="stat-total">0</b><p class="text-xs">Total</p></div><div class="bg-green-500/20 p-3 rounded-xl text-center"><b id="stat-hechas">0</b><p class="text-xs">Hechas</p></div><div class="bg-blue-500/20 p-3 rounded-xl text-center"><button onclick="analisisIA()" class="text-xs bg-blue-600 px-3 py-1 rounded-full">🤖 Analizar con IA</button></div></div>
    <div id="ia-box" class="hidden bg-gradient-to-r from-purple-600 to-blue-600 p-4 rounded-2xl mb-4"><h3 class="font-bold">🤖 Análisis IA:</h3><p id="ia-text" class="text-sm mt-2"></p></div>
    <div class="bg-white text-gray-800 p-5 rounded-2xl mb-6">
      <h2 class="font-bold mb-3">Nueva Tarea con Foto y Voz</h2>
      <div class="flex gap-2 mb-2"><input id="titulo" placeholder="Título..." class="flex-1 p-3 border rounded-xl"><button onclick="startVoz()" id="btn-voz" class="bg-red-500 text-white px-4 rounded-xl"><i class="fas fa-microphone"></i></button></div>
      <textarea id="descripcion" placeholder="Descripción" class="w-full p-3 border rounded-xl mb-2"></textarea>
      <div class="flex gap-2 mb-3"><select id="area" class="flex-1 p-3 border rounded-xl"><option>Preventivo</option><option>Correctivo</option><option>Eléctrico</option><option>Mecánico</option><option>Programación</option></select><select id="prioridad" class="flex-1 p-3 border rounded-xl"><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select></div>
      <div class="border-2 border-dashed border-gray-300 rounded-xl p-3 mb-3 text-center"><input type="file" id="foto-input" accept="image/*" capture="environment" class="hidden" onchange="previewFoto(event)"><button onclick="document.getElementById('foto-input').click()" class="text-sm text-blue-600 font-bold"><i class="fas fa-camera"></i> Tomar Foto de la Falla</button><img id="preview" class="hidden w-full h-32 object-cover rounded-xl mt-2"><p id="foto-nombre" class="text-xs text-gray-500 mt-1"></p></div>
      <button onclick="guardarTarea()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Guardar con Foto <i class="fas fa-cloud-upload"></i></button><p id="save-status" class="text-center text-sm mt-2 font-bold text-green-600"></p>
    </div>
    <input id="buscador" oninput="filtrar()" placeholder="🔍 Buscar..." class="w-full p-3 rounded-xl bg-white/10 border border-white/20 mb-4">
    <div id="lista-tareas" class="grid md:grid-cols-2 gap-4"></div>
  </main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, where, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
const firebaseConfig = { apiKey: "AIzaSyAYr6gWLwirpYIvHDccIhWLifz3bk7WHl8", authDomain: "mantenimiento--pro.firebaseapp.com", projectId: "mantenimiento--pro", storageBucket: "mantenimiento--pro.firebasestorage.app", messagingSenderId: "954410177409", appId: "1:954410177409:web:83bba9aaf3d94c24c50e80" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); const storage = getStorage(app);
let todas=[], fotoFile=null;
window.login=async()=>{const e=document.getElementById('email').value,p=document.getElementById('password').value,err=document.getElementById('login-error'); err.textContent="Cargando..."; try{await signInWithEmailAndPassword(auth,e,p); err.textContent="";}catch{try{await createUserWithEmailAndPassword(auth,e,p); err.textContent="";}catch(e2){err.textContent=e2.message;}}}
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,(u)=>{if(u){document.getElementById('login-screen').classList.add('hidden');document.getElementById('app-screen').classList.remove('hidden');document.getElementById('user-email').textContent=u.email;cargar(u);}else{document.getElementById('login-screen').classList.remove('hidden');document.getElementById('app-screen').classList.add('hidden');}});
function cargar(user){onSnapshot(query(collection(db,"tareas"),where("uid","==",user.uid)),(snap)=>{todas=[]; snap.forEach(d=>todas.push({id:d.id,...d.data()})); todas.sort((a,b)=>(b.creado?.seconds||0)-(a.creado?.seconds||0)); document.getElementById('stat-total').textContent=todas.length; document.getElementById('stat-hechas').textContent=todas.filter(t=>t.completada).length; filtrar();});}
window.previewFoto=(e)=>{fotoFile=e.target.files[0]; if(fotoFile){const r=document.getElementById('preview'); r.src=URL.createObjectURL(fotoFile); r.classList.remove('hidden'); document.getElementById('foto-nombre').textContent="📸 "+fotoFile.name;}}
window.startVoz=()=>{const btn=document.getElementById('btn-voz'); if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window))return alert("Tu navegador no soporta voz, usa Chrome"); const Rec=window.SpeechRecognition||window.webkitSpeechRecognition; const rec=new Rec(); rec.lang='es-MX'; btn.innerHTML='<i class="fas fa-circle-notch fa-spin"></i>'; rec.start(); rec.onresult=(ev)=>{document.getElementById('titulo').value=ev.results[0][0].transcript; btn.innerHTML='<i class="fas fa-microphone"></i>';}; rec.onerror=()=>{btn.innerHTML='<i class="fas fa-microphone"></i>';};}
window.guardarTarea=async()=>{const user=auth.currentUser, tit=document.getElementById('titulo').value; if(!tit)return alert("Título"); document.getElementById('save-status').textContent="Subiendo... ⏳"; let fotoURL=""; try{if(fotoFile){const r=ref(storage,`tareas/${user.uid}/${Date.now()}_${fotoFile.name}`); await uploadBytes(r,fotoFile); fotoURL=await getDownloadURL(r);} await addDoc(collection(db,"tareas"),{uid:user.uid,titulo:tit,descripcion:document.getElementById('descripcion').value,area:document.getElementById('area').value,prioridad:document.getElementById('prioridad').value,completada:false,foto:fotoURL,creado:serverTimestamp()}); document.getElementById('titulo').value=""; document.getElementById('descripcion').value=""; document.getElementById('preview').classList.add('hidden'); document.getElementById('foto-nombre').textContent=""; fotoFile=null; document.getElementById('foto-input').value=""; document.getElementById('save-status').textContent="¡Guardado con IA! ✅"; setTimeout(()=>document.getElementById('save-status').textContent="",2000);}catch(e){alert("Error: "+e.message+" - Activa Storage en Firebase"); document.getElementById('save-status').textContent="";}}
window.filtrar=()=>{const txt=document.getElementById('buscador').value.toLowerCase(); let f=todas.filter(t=>t.titulo.toLowerCase().includes(txt)); document.getElementById('lista-tareas').innerHTML=f.map(t=>`<div class="bg-white text-gray-800 p-4 rounded-2xl shadow"><div class="flex justify-between text-xs mb-2"><span class="font-bold ${t.prioridad=='alta'?'text-red-500':'text-green-600'}">${t.prioridad.toUpperCase()}</span><span class="bg-gray-100 px-2 rounded-full">${t.area}</span></div><h3 class="font-bold ${t.completada?'line-through':''}">${t.titulo}</h3><p class="text-sm text-gray-500">${t.descripcion||''}</p>${t.foto?`<img src="${t.foto}" class="w-full h-32 object-cover rounded-xl mt-2">`:""}<div class="flex gap-2 mt-3"><button onclick="toggle('${t.id}',${!t.completada})" class="flex-1 ${t.completada?'bg-gray-200':'bg-green-600 text-white'} p-2 rounded-xl text-sm">${t.completada?'Deshacer':'Hecha'}</button><button onclick="borrar('${t.id}')" class="bg-red-50 text-red-500 p-2 rounded-xl"><i class="fas fa-trash"></i></button><button onclick="leerVoz('${t.titulo.replace(/'/g,'')}')" class="bg-blue-50 text-blue-500 p-2 rounded-xl"><i class="fas fa-volume-up"></i></button></div></div>`).join('');}
window.borrar=async(id)=>{if(confirm("¿Borrar?"))await deleteDoc(doc(db,"tareas",id));}
window.toggle=async(id,v)=>{await updateDoc(doc(db,"tareas",id),{completada:v});}
window.leerVoz=(txt)=>{const u=new SpeechSynthesisUtterance(txt); u.lang='es-MX'; speechSynthesis.speak(u);}
window.analisisIA=()=>{if(todas.length==0)return alert("No hay tareas"); const altas=todas.filter(t=>t.prioridad=='alta'&&!t.completada).length; const pend=todas.filter(t=>!t.completada).length; document.getElementById('ia-box').classList.remove('hidden'); document.getElementById('ia-text').innerHTML=`Tienes <b>${pend} pendientes</b>, <b>${altas} urgentes</b>. IA recomienda: ${altas>0?`Atender primero las ${altas} de prioridad alta, la más reciente es "${todas.find(t=>t.prioridad=='alta'&&!t.completada)?.titulo||''}"`:"¡Todo bajo control! Puedes programar mantenimiento preventivo."} <br><br> <b>Reporte automático:</b> Productividad ${todas.length?Math.round(todas.filter(t=>t.completada).length/todas.length*100):0}%`; window.leerVoz(document.getElementById('ia-text').innerText);}
</script>
</body>
</html>
